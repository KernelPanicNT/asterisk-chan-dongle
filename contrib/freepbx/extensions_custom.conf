; chan_dongle + FreePBX 17 — append to /etc/asterisk/extensions_custom.conf
; and set "context=from-dongle" in /etc/asterisk/dongle.conf ([defaults] or per device).
; Then: fwconsole reload
;
; Incoming calls are passed to FreePBX's normal inbound routing (from-trunk)
; using the SIM's number as DID, so you can create an Inbound Route for it
; in the GUI. Set "exten=+34XXXXXXXXX" in dongle.conf if the SIM does not
; report its own number (DONGLENUMBER empty / "Unknown").

[from-dongle]
; --- Incoming voice calls --------------------------------------------------
exten => _[+0-9].,1,NoOp(Incoming call on ${DONGLENAME} (${DONGLEPROVIDER}) from ${CALLERID(num)})
 same => n,Goto(from-trunk,${EXTEN},1)

exten => s,1,NoOp(Incoming call on ${DONGLENAME} without DID)
 same => n,Goto(from-trunk,${IF($["${DONGLENUMBER}" != "" & "${DONGLENUMBER}" != "Unknown"]?${DONGLENUMBER}:s)},1)

; --- Incoming SMS ----------------------------------------------------------
; The message body is in ${SMS_BASE64}; never pass ${SMS} to System() unescaped.
exten => sms,1,NoOp(SMS on ${DONGLENAME} from ${CALLERID(num)})
 same => n,Set(SMSTEXT=${BASE64_DECODE(${SMS_BASE64})})
 same => n,Set(FILE(/var/log/asterisk/sms.txt,,,al)=${STRFTIME(${EPOCH},,%F %T)};${DONGLENAME};${CALLERID(num)};${SMS_BASE64})
 same => n,Hangup()

; --- Incoming USSD ---------------------------------------------------------
exten => ussd,1,NoOp(USSD on ${DONGLENAME}: type ${USSD_TYPE_STR})
 same => n,Set(FILE(/var/log/asterisk/ussd.txt,,,al)=${STRFTIME(${EPOCH},,%F %T)};${DONGLENAME};${USSD_BASE64})
 same => n,Hangup()

; --- SMS delivery reports --------------------------------------------------
exten => report,1,NoOp(SMS report ${DONGLENAME}: ${SMS_REPORT})
 same => n,Hangup()
