name: build

on:
  push:
  pull_request:
  workflow_dispatch:

# Failures are published as annotations (gcc problem matcher + ci/gh-run.sh)
# so they can be read from the checks API without downloading the logs.

jobs:
  # Asterisk built from the official source tarball on Debian 13 (trixie).
  source:
    name: Debian ${{ matrix.debian }} ${{ matrix.arch }} / Asterisk ${{ matrix.asterisk }} (source)
    runs-on: ${{ matrix.runner }}
    container: debian:${{ matrix.debian }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        debian: ['13']
        asterisk: ['24', '22', '20']
        arch: [amd64]
        runner: [ubuntu-latest]
        include:
          # Raspberry Pi 4/5 (Debian 13 arm64): FreePBX packages are amd64-only,
          # so on a Pi Asterisk is built from source.
          - { debian: '13', asterisk: '24', arch: arm64, runner: ubuntu-24.04-arm }
          - { debian: '13', asterisk: '22', arch: arm64, runner: ubuntu-24.04-arm }
    steps:
      - name: Install git
        run: apt-get update -qq && apt-get install -y -qq git ca-certificates
      - uses: actions/checkout@v5
      - name: Build dependencies
        run: ci/gh-run.sh deps sh ci/install-build-deps.sh --asterisk
      - name: Restore Asterisk build
        id: ast-cache
        uses: actions/cache/restore@v4
        with:
          path: /usr/src/ast-${{ matrix.asterisk }}
          key: ast-src-deb${{ matrix.debian }}-${{ matrix.arch }}-${{ matrix.asterisk }}-${{ hashFiles('ci/build-asterisk.sh') }}-v2
      - name: Build and install Asterisk ${{ matrix.asterisk }}
        run: |
          D=/usr/src/ast-${{ matrix.asterisk }}
          if [ -d "$D/asterisk" ]; then
            cd "$D/asterisk" && make -s install install-headers >/dev/null && make -s samples >/dev/null && ldconfig && asterisk -V
          else
            ci/gh-run.sh asterisk sh ci/build-asterisk.sh ${{ matrix.asterisk }} "$D"
            cd "$D" && mv asterisk-*/ asterisk
          fi
      # Save right away so a later chan_dongle failure doesn't discard it.
      - name: Save Asterisk build
        if: steps.ast-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: /usr/src/ast-${{ matrix.asterisk }}
          key: ${{ steps.ast-cache.outputs.cache-primary-key }}
      - name: Build chan_dongle (warnings as errors) and unit tests
        run: |
          echo "::add-matcher::.github/gcc-problem-matcher.json"
          ci/gh-run.sh build sh ci/build-module.sh
      - name: Runtime smoke test
        run: ci/gh-run.sh smoke sh ci/smoke-test.sh

  # Asterisk packages exactly as FreePBX 17 installs them (Debian 12).
  freepbx17:
    name: FreePBX 17 / Debian 12 / Asterisk ${{ matrix.asterisk }} (Sangoma packages)
    runs-on: ubuntu-latest
    container: debian:12
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        asterisk: ['22', '23']
    steps:
      - name: Install git
        run: apt-get update -qq && apt-get install -y -qq git ca-certificates
      - uses: actions/checkout@v5
      - name: Build dependencies
        run: ci/gh-run.sh deps sh ci/install-build-deps.sh
      - name: FreePBX 17 Asterisk ${{ matrix.asterisk }} packages
        run: ci/gh-run.sh freepbx sh ci/install-freepbx-asterisk.sh ${{ matrix.asterisk }}
      - name: Build chan_dongle (warnings as errors) and unit tests
        run: |
          echo "::add-matcher::.github/gcc-problem-matcher.json"
          ci/gh-run.sh build sh ci/build-module.sh
      - name: Runtime smoke test
        run: ci/gh-run.sh smoke sh ci/smoke-test.sh
